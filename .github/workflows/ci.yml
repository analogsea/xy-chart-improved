name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build, lint, test and package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      plugin-id: ${{ steps.metadata.outputs.plugin-id }}
      plugin-version: ${{ steps.metadata.outputs.plugin-version }}
      plugin-dist-artifact: ${{ steps.metadata.outputs.plugin-dist-artifact }}
      has-e2e: ${{ steps.check-for-e2e.outputs.has-e2e }}
      has-backend: ${{ steps.check-for-backend.outputs.has-backend }}
    env:
      GRAFANA_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_ACCESS_POLICY_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(mise exec -- npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('mise.toml') }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('mise.toml') }}-npm-
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: mise exec -- npm ci

      - name: Check types
        run: mise exec -- npm run typecheck

      - name: Lint
        run: mise exec -- npm run lint

      - name: Unit tests
        run: mise exec -- npm run test:ci

      - name: Build frontend
        run: mise exec -- npm run build

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Check for backend
        id: check-for-backend
        run: |
          if [ -f "Magefile.go" ]; then
            echo "has-backend=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go environment
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest
          args: ./...

      - name: Build backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: buildAll

      - name: Test backend
        if: steps.check-for-backend.outputs.has-backend == 'true'
        uses: magefile/mage-action@a662bd8c29d8106879588cfff83b2faf6e6f59db # v4.0.0
        with:
          version: latest
          args: test

      - name: Check for E2E
        id: check-for-e2e
        run: |
          if [ -f "playwright.config.ts" ]; then
            echo "has-e2e=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve PR smoke E2E image
        id: resolve-smoke-version
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        uses: grafana/plugin-actions/e2e-version@e2e-version/v2.0.0
        with:
          skip-grafana-nightly-image: true
          limit: 1

      - name: Select PR smoke E2E image
        id: smoke-image
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        run: |
          mise exec -- node <<'NODE' >> "$GITHUB_OUTPUT"
          const matrix = JSON.parse(process.env.MATRIX);
          const image = matrix[0];

          if (!image) {
            throw new Error('No Grafana image resolved for PR smoke E2E');
          }

          console.log(`image=${image.NAME ?? image.name}`);
          console.log(`version=${image.VERSION ?? image.version}`);
          NODE
        env:
          MATRIX: ${{ steps.resolve-smoke-version.outputs.matrix }}

      - name: Start Grafana for PR smoke E2E
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        run: |
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ steps.smoke-image.outputs.version }} GRAFANA_IMAGE=${{ steps.smoke-image.outputs.image }} docker compose up -d

      - name: Wait for PR smoke Grafana server
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.4
        with:
          url: http://localhost:3000/login

      - name: Install Playwright browsers for PR smoke E2E
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        run: mise exec -- npm exec playwright install chromium --with-deps --only-shell

      - name: Run PR smoke E2E
        id: run-pr-smoke-e2e
        if: ${{ github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        run: mise exec -- npm run e2e

      - name: Docker logs for PR smoke E2E
        if: ${{ always() && github.event_name == 'pull_request' && steps.run-pr-smoke-e2e.outcome == 'failure' }}
        run: docker logs analogsea-xychartimproved-panel >& grafana-server.log

      - name: Stop PR smoke Grafana docker
        if: ${{ always() && github.event_name == 'pull_request' && steps.check-for-e2e.outputs.has-e2e == 'true' }}
        run: docker compose down

      - name: Sign plugin
        if: ${{ env.GRAFANA_ACCESS_POLICY_TOKEN != '' }}
        run: mise exec -- npm run sign

      - name: Get plugin metadata
        id: metadata
        run: |
          plugin_id="$(node -p "require('./dist/plugin.json').id")"
          plugin_version="$(node -p "require('./dist/plugin.json').info.version")"

          {
            echo "plugin-id=${plugin_id}"
            echo "plugin-version=${plugin_version}"
            echo "plugin-dist-artifact=${plugin_id}-${plugin_version}-dist"
            echo "plugin-zip-artifact=${plugin_id}-${plugin_version}-zip"
          } >> "$GITHUB_OUTPUT"

      - name: Package plugin
        id: package-plugin
        run: |
          set -euo pipefail

          archive="${PLUGIN_ID}-${PLUGIN_VERSION}.zip"
          rm -rf artifacts/package
          mkdir -p artifacts/package
          cp -R dist "artifacts/package/${PLUGIN_ID}"

          (
            cd artifacts/package
            zip -r "../${archive}" "${PLUGIN_ID}"
          )

          echo "archive=artifacts/${archive}" >> "$GITHUB_OUTPUT"
        env:
          PLUGIN_ID: ${{ steps.metadata.outputs.plugin-id }}
          PLUGIN_VERSION: ${{ steps.metadata.outputs.plugin-version }}

      - name: Check plugin archive
        run: |
          docker run --pull=always --rm \
            -v "$PWD/${ARCHIVE}:/archive.zip:ro" \
            grafana/plugin-validator-cli -analyzer=metadatavalid /archive.zip
        env:
          ARCHIVE: ${{ steps.package-plugin.outputs.archive }}

      - name: Upload plugin dist
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plugin-dist-artifact }}
          path: dist
          retention-days: 5

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.plugin-zip-artifact }}
          path: ${{ steps.package-plugin.outputs.archive }}
          retention-days: 5

  resolve-versions:
    name: Resolve e2e images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    needs: build
    if: ${{ github.event_name != 'pull_request' && needs.build.outputs.has-e2e == 'true' }}
    outputs:
      matrix: ${{ steps.resolve-versions.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve Grafana E2E versions
        id: resolve-versions
        uses: grafana/plugin-actions/e2e-version@e2e-version/v2.0.0
        with:
          skip-grafana-nightly-image: true

  playwright-tests:
    needs: [resolve-versions, build]
    if: ${{ github.event_name != 'pull_request' && needs.build.outputs.has-e2e == 'true' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        GRAFANA_IMAGE: ${{ fromJson(needs.resolve-versions.outputs.matrix) }}
    name: e2e test ${{ matrix.GRAFANA_IMAGE.name }}@${{ matrix.GRAFANA_IMAGE.VERSION }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download plugin dist
        uses: actions/download-artifact@v8
        with:
          path: dist
          name: ${{ needs.build.outputs.plugin-dist-artifact }}

      - name: Execute permissions on binary
        if: needs.build.outputs.has-backend == 'true'
        run: chmod +x ./dist/gpx_*

      - name: Install mise tools
        uses: jdx/mise-action@v4
        with:
          install: true
          cache: true

      - name: Resolve npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(mise exec -- npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-node-${{ hashFiles('mise.toml') }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ hashFiles('mise.toml') }}-npm-
            ${{ runner.os }}-npm-

      - name: Install dev dependencies
        run: mise exec -- npm ci

      - name: Start Grafana
        run: |
          docker compose pull
          ANONYMOUS_AUTH_ENABLED=false DEVELOPMENT=false GRAFANA_VERSION=${{ matrix.GRAFANA_IMAGE.VERSION }} GRAFANA_IMAGE=${{ matrix.GRAFANA_IMAGE.NAME }} docker compose up -d

      - name: Wait for grafana server
        uses: grafana/plugin-actions/wait-for-grafana@wait-for-grafana/v1.0.4
        with:
          url: http://localhost:3000/login

      - name: Install Playwright Browsers
        run: mise exec -- npm exec playwright install chromium --with-deps --only-shell

      - name: Run Playwright tests
        id: run-tests
        run: mise exec -- npm run e2e

      - name: Upload e2e test summary
        uses: grafana/plugin-actions/playwright-gh-pages/upload-report-artifacts@upload-report-artifacts/v1.0.1
        if: ${{ always() && !cancelled() }}
        with:
          upload-report: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-outcome: ${{ steps.run-tests.outcome }}

      - name: Docker logs
        if: ${{ always() && steps.run-tests.outcome == 'failure' }}
        run: docker logs analogsea-xychartimproved-panel >& grafana-server.log

      - name: Stop grafana docker
        if: ${{ always() }}
        run: docker compose down
